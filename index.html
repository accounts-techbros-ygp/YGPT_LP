<title>Welcome to YourGP</title>

<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: YourGP app shell. Fixed left sidebar (role menu) + topbar + grouped link-card grid. Light mode only, per the YourGP design system. */
:root{
  color-scheme: light;
  --bg: oklch(98.5% 0.006 200);
  --surface: oklch(100% 0 0);
  --surface-sunk: oklch(97% 0.006 200);
  --ink: oklch(26% 0.02 220);
  --ink-muted: oklch(41% 0.016 220);
  --ink-faint: oklch(49% 0.014 220);
  --hairline: oklch(91% 0.008 200);
  --hairline-strong: oklch(83% 0.012 200);
  --accent: oklch(58% 0.11 205);
  --accent-strong: oklch(50% 0.12 205);
  --accent-weak: oklch(58% 0.11 205 / 0.12);
  --on-accent: oklch(100% 0 0);
  --notice-bg: oklch(96.5% 0.018 205);
  --notice-line: oklch(86% 0.035 205);
  --danger: oklch(62% 0.19 45); --danger-soft: oklch(97% 0.035 55); --danger-ink: oklch(50% 0.18 45);
  --scrim: oklch(22% 0.02 220 / .45);
  --topbar-bg: oklch(98.5% 0.006 200 / 0.85);
  --radius: 14px; --radius-sm: 9px;
  --shadow: 0 1px 2px oklch(40% 0.03 220 / 0.05), 0 4px 16px oklch(40% 0.03 220 / 0.05);
  --shadow-hover: 0 2px 4px oklch(40% 0.03 220 / 0.06), 0 10px 24px oklch(40% 0.03 220 / 0.09);
  --shadow-pop: 0 8px 28px oklch(40% 0.03 220 / 0.14), 0 2px 6px oklch(40% 0.03 220 / 0.08);
  --sidebar-w: 256px;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button{ font:inherit; cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.app{ display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }

/* Sidebar */
.sidebar{ background:var(--surface); border-right:1px solid var(--hairline); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px; }
.brand .mark{ width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; color:var(--on-accent); font-weight:700; font-size:15px; font-family:var(--font-display); flex:none; }
.brand .nm{ font-weight:700; font-size:16px; letter-spacing:-.01em; line-height:1.25; }
.brand .nm span{ color:var(--ink-faint); font-weight:500; display:block; font-size:13px; letter-spacing:.02em; text-transform:uppercase; }
.nav-label{ font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:12px 22px 4px; }
.nav{ padding:8px 12px; display:flex; flex-direction:column; gap:6px; }
.nav-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:var(--ink-muted); padding:10px 12px; border-radius:var(--radius-sm); font-size:15px; font-weight:600; text-decoration:none; transition:background .12s, color .12s; }
.nav-item:hover{ background:var(--surface-sunk); color:var(--ink); }
.nav-item.on{ background:var(--accent-weak); color:var(--accent-strong); }
.nav-ic{ width:18px; height:18px; flex:0 0 auto; opacity:.85; }
.nav-item.on .nav-ic{ opacity:1; }
.nav-item .ext{ width:14px; height:14px; margin-left:auto; opacity:.6; }
.nav-div{ height:1px; background:var(--hairline); margin:10px 12px; }
.side-foot{ margin-top:auto; border-top:1px solid var(--hairline); padding:14px 22px 18px; font-size:13px; color:var(--ink-faint); }

/* Main */
.main{ display:flex; flex-direction:column; min-width:0; }
.topbar{ position:sticky; top:0; z-index:30; background:var(--topbar-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:14px; padding:14px 32px; }
.tb-titles{ min-width:0; }
.topbar .tt{ font-family:var(--font-display); font-weight:500; font-size:19px; letter-spacing:-.01em; }
.topbar .ts{ font-size:13.5px; color:var(--ink-muted); margin-top:1px; }
.today{ margin-left:auto; font-size:13.5px; color:var(--ink-faint); white-space:nowrap; }
.menu-btn{ display:none; align-items:center; justify-content:center; width:38px; height:38px; flex:none; border:1px solid var(--hairline-strong); background:var(--surface); border-radius:10px; color:var(--ink); padding:0; }
.menu-btn svg{ width:20px; height:20px; }
.nav-backdrop{ display:none; }

.content{ padding:28px 32px 56px; max-width:1400px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:28px; }

/* Bookmarks: one panel, A to Z, flowing down columns */
.bookmarks{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; }
.lrows{ list-style:none; margin:0; padding:0; columns:340px; column-gap:24px; }
.lrow{ display:flex; align-items:center; gap:8px; border-radius:var(--radius-sm); min-width:0; break-inside:avoid; transition:background .12s; }
.lrow:hover{ background:var(--surface-sunk); }
.l-main{ display:flex; align-items:center; gap:14px; flex:1; min-width:0; padding:10px 6px 10px 10px; text-decoration:none; color:var(--ink); border-radius:var(--radius-sm); }
.l-logo{ width:40px; height:40px; flex:none; border-radius:10px; border:1px solid var(--hairline); background:var(--surface); display:grid; place-items:center; overflow:hidden; color:var(--ink-muted); }
.l-logo.img{ padding:2px; }
.l-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
.l-logo.bleed{ padding:0; border-color:transparent; }
.l-logo svg{ width:17px; height:17px; }
.l-logo.ygp{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
.l-name{ font-weight:700; font-size:15px; letter-spacing:-.005em; line-height:1.3; min-width:0; text-wrap:balance; }
.l-main:hover .l-name{ color:var(--accent-strong); }
.l-acts{ display:flex; gap:6px; padding-right:8px; flex:none; }
.l-btn{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; border:1px solid var(--hairline-strong); background:var(--surface); color:var(--ink-muted); text-decoration:none; white-space:nowrap; transition:border-color .12s, color .12s, background .12s; }
.l-btn svg{ width:11px; height:11px; }
.l-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
.l-btn.primary{ background:var(--accent-weak); border-color:transparent; color:var(--accent-strong); }
.l-btn.primary:hover{ background:var(--accent); color:var(--on-accent); }
.l-go{ width:14px; height:14px; flex:none; color:var(--ink-faint); opacity:0; transition:opacity .12s; margin-right:10px; }
.lrow:hover .l-go{ opacity:1; color:var(--accent-strong); }
.no-match{ margin:6px 10px; color:var(--ink-muted); font-size:14px; }

/* Announcements: their own teal-washed board, so they never look like a bookmark */
.notices{ background:var(--notice-bg); border:1px solid var(--notice-line); border-radius:var(--radius); padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; }
.n-head{ display:flex; align-items:center; gap:10px; }
.n-badge{ width:30px; height:30px; flex:none; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; }
.n-badge svg{ width:16px; height:16px; }
.n-head h2{ font-family:var(--font-display); font-weight:500; font-size:17px; letter-spacing:-.01em; margin:0; color:var(--accent-strong); }
.n-count{ font-size:12.5px; font-weight:700; color:var(--accent-strong); background:var(--surface); border:1px solid var(--notice-line); border-radius:999px; padding:1px 9px; font-variant-numeric:tabular-nums; }
.n-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.callout{ background:var(--surface); border:1px solid var(--notice-line); border-radius:var(--radius-sm); padding:12px 16px; font-size:14px; color:var(--ink-muted); display:flex; gap:6px 16px; align-items:center; flex-wrap:wrap; }
.callout.urgent{ border-color:var(--danger); border-left-width:4px; background:var(--danger-soft); }
.callout .c-body{ flex:1 1 100%; min-width:0; }
@media(min-width:700px){ .callout{ flex-wrap:nowrap; } .callout .c-body{ flex:1 1 auto; } }
.callout .ch{ font-weight:700; color:var(--ink); margin-right:8px; }
.callout .tag{ display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--surface); background:var(--danger-ink); border-radius:5px; padding:1px 6px; margin-right:8px; vertical-align:1px; }
.callout .cd{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:var(--accent-strong); background:var(--notice-bg); border:1px solid var(--notice-line); border-radius:999px; padding:3px 10px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.callout .cd svg{ width:13px; height:13px; }
.callout .cd .cd-date{ font-weight:500; color:var(--ink-faint); }
.callout .cd.soon{ color:var(--danger-ink); background:var(--danger-soft); border-color:oklch(85% 0.07 50); }
.callout .c-link{ display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:8px 16px; border-radius:var(--radius-sm); background:var(--accent-strong); color:var(--on-accent); font-size:14px; font-weight:700; text-decoration:none; white-space:nowrap; box-shadow:0 1px 2px oklch(40% 0.03 220 / .15); transition:background .12s, transform .12s; }
.callout .c-link:hover{ background:var(--accent); }
.callout .c-link:active{ transform:translateY(1px); }
.callout .c-link:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
.callout .c-link svg{ width:14px; height:14px; }

/* Search (doctors) */
.finder{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--radius); box-shadow:var(--shadow); padding:8px 12px 8px 16px; }
.finder:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak), var(--shadow); }
.f-ic{ width:18px; height:18px; color:var(--ink-faint); flex:none; }
.finder input{ flex:1 1 200px; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:15px; color:var(--ink); padding:8px 0; }
.finder input::placeholder{ color:var(--ink-faint); }
.f-kbd{ font:600 12px var(--font-body); color:var(--ink-faint); border:1px solid var(--hairline-strong); border-bottom-width:2px; border-radius:6px; padding:1px 7px; }
.f-web{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px; border-top:1px solid var(--hairline); padding:8px 0 4px; }
.f-web-l{ font-size:13px; color:var(--ink-muted); margin-right:4px; }
@media (pointer:coarse){ .f-kbd{ display:none; } }

/* Accessibility helpers */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:12px; top:-60px; z-index:100; background:var(--ink); color:var(--surface); padding:10px 14px; border-radius:var(--radius-sm); font-weight:600; text-decoration:none; }
.skip:focus{ top:12px; }
.content:focus{ outline:none; }
.req{ color:var(--danger-ink); font-weight:700; margin-left:2px; }
.nav-note{ margin:2px 0 0; padding:0 12px 0 41px; font-size:12.5px; color:var(--ink-faint); }
.topbar .tt{ margin:0; }
.topbar .ts{ margin:1px 0 0; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

@media(max-width:880px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ position:fixed; left:0; top:0; height:100vh; width:280px; max-width:82vw; transform:translateX(-100%); transition:transform .25s ease; z-index:70; box-shadow:var(--shadow-pop); padding-top:env(safe-area-inset-top, 0px); }
  .sidebar.open{ transform:translateX(0); }
  .nav-backdrop{ display:block; position:fixed; inset:0; background:transparent; z-index:65; pointer-events:none; transition:background .25s ease; }
  .nav-backdrop.show{ background:var(--scrim); pointer-events:auto; }
  .menu-btn{ display:inline-flex; }
  .topbar{ padding:11px 16px; gap:11px; top:env(safe-area-inset-top, 0px); }
  .topbar .tt{ font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .ts{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .content{ padding:18px 16px 48px; gap:20px; }
}
@media (pointer:coarse), (max-width:880px){
  .l-main{ min-height:52px; }
  .l-btn{ min-height:40px; padding:6px 12px; font-size:13.5px; }
  .nav-item{ min-height:46px; }
  .callout .c-link{ min-height:40px; }
}
@media(max-width:520px){
  .topbar .ts, .today{ display:none; }
}
</style>

</head>
<body>
<a class="skip" href="#content">Skip to links</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="brand"><div class="mark" aria-hidden="true">Y</div><div class="nm"><span>Welcome to</span>YourGP</div></div>
    <nav aria-labelledby="roleLabel">
      <div class="nav-label" id="roleLabel">Bookmarks</div>
      <div class="nav" id="roleNav"></div>
    </nav>
    <div class="nav-div" role="presentation"></div>
    <nav class="nav" aria-label="Other apps">
      <a class="nav-item" id="appsLink" href="#" target="_blank" rel="noopener">
        <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        <span>YGP Apps<span class="req" aria-hidden="true">*</span></span>
        <span class="sr-only">(needs login, opens in a new tab)</span>
        <svg class="ext" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
      <p class="nav-note" aria-hidden="true"><span class="req">*</span> Needs login</p>
    </nav>
    <div class="side-foot">YourGP · Crace, Denman, Lyneham</div>
  </aside>
  <div class="nav-backdrop" id="backdrop" aria-hidden="true"></div>

  <div class="main" id="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="tb-titles"><h1 class="tt" id="roleTitle">Doctors</h1></div>
      <div class="today" id="today"></div>
    </header>
    <main class="content" id="content" tabindex="-1" aria-labelledby="roleTitle"></main>
  </div>
</div>

<script>
/* ============================================================
   BOOKMARKS: edit this block to change what's on the page.
   Each role has a list of links. They're sorted A to Z automatically,
   so add new ones anywhere in the list.

   Link fields:
     name  = what shows on the page
     url   = where it goes (for login sites, the login page)
     site  = optional public website, adds a "Site" button
     login = true  -> adds a "Log in" button
     logo  = which logo to show (see LOGOS at the bottom of the script)
     icon  = line icon used when there's no logo (see ICONS below)
     ygp   = true  -> YourGP-built tool, shows the teal Y tile
     searchSite = adds this site to the doctors' topic search buttons
   ============================================================ */
const YGP_APPS_URL = "https://ygpapp.com/";

const ROLES = [
  {
    id: "doctors", label: "Doctors", icon: "steth", search: true,
    links: [
      { name: "Australian Medicines Handbook", logo: "amh", searchSite: "amh.net.au", url: "https://amhonline.amh.net.au/auth", site: "https://shop.amh.net.au/", login: true, icon: "pill" },
      { name: "Austroads", logo: "austroads", searchSite: "austroads.gov.au", url: "https://austroads.gov.au/login", site: "https://austroads.gov.au/", login: true, icon: "car" },
      { name: "DermNet", logo: "dermnet", searchSite: "dermnetnz.org", url: "https://pro.dermnetnz.org/Security/login?BackURL=home", site: "https://dermnetnz.org/", login: true, icon: "image" },
      { name: "GPnotebook", logo: "gpnotebook", searchSite: "gpnotebook.com", url: "https://gpnotebook.com/en-AU/sign-in?from=%2Fen-AU", site: "https://gpnotebook.com/en-AU", login: true, icon: "note" },
      { name: "MS Teams", logo: "teams", url: "https://teams.microsoft.com/v2/", icon: "chat" },
      { name: "NB Medical", logo: "nbmedical", url: "https://www.nbmedical.com/", icon: "cap" },
      { name: "Outlook", logo: "outlook", url: "https://outlook.office.com/", icon: "mail" },
      { name: "Patient Info", logo: "patientinfo", searchSite: "patient.info", url: "https://accounts.patient.info/sign-in?redirect_url=https%3A%2F%2Fpatient.info%2F", site: "https://patient.info/", login: true, icon: "info" },
      { name: "Therapeutic Guidelines", logo: "tg", searchSite: "tg.org.au", url: "https://portal.tg.org.au", site: "https://www.tg.org.au/", login: true, icon: "book" }
    ]
  },
  {
    id: "reception", label: "Reception/Admin", icon: "desk",
    links: [
      { name: "ABBA (appointment auditor)", logo: "abba", url: "https://ygpapp.com/", icon: "check" },   // TODO: direct ABBA link
      { name: "Automed", logo: "automed", url: "https://automedsystems.com.au/online/dashboard/login", icon: "kiosk" },
      { name: "Cloop", ygp: true, url: "https://launcher.myapps.microsoft.com/api/signin/053b1ab2-950c-4dcb-ba80-f04d21f9ba72?tenantId=d9d0a520-4423-4c6b-aa80-01127574c968", icon: "mail" },
      { name: "CRT (Call Review Tool)", ygp: true, url: "https://staging.crt.ygpapp.com/login", icon: "mic" },
      { name: "GP preferences", logo: "sharepoint", url: "https://yourgpcanberra.sharepoint.com/:l:/r/sites/TheNewPlaybook/Lists/GP%20Preferences?e=icRveQ", icon: "list" },
      { name: "HotDoc", logo: "hotdoc", url: "https://www.hotdoc.com.au/dashboard#/login", icon: "calendar" },
      { name: "MS Teams", logo: "teams", url: "https://teams.microsoft.com/v2/", icon: "chat" },
      { name: "National Immunisation Program", logo: "health-gov", url: "https://www.health.gov.au/resources/publications/national-immunisation-program-schedule?language=en", icon: "shield" },
      { name: "Playbook", logo: "sharepoint", url: "https://yourgpcanberra.sharepoint.com/sites/TheNewPlaybook", icon: "folder" },
      { name: "Tasky", ygp: true, url: "https://tasky.ygpapp.com/", icon: "check" },
      { name: "healthdirect", logo: "healthdirect", url: "https://www.healthdirect.gov.au", icon: "info" },
      { name: "Medicare Mental Health", logo: "medicare-mh", url: "https://www.headtohealth.gov.au", icon: "heart" }
    ]
  }
];
const DEFAULT_ROLE = "doctors";

/* ============================================================
   ANNOUNCEMENTS: shown at the top of the page.
   Leave the list empty  ->  []  and the whole section disappears.
   Optional fields:
     roles:  ["doctors","reception"]  (leave out = everyone)
     until:  "2026-10-20"        (shows a countdown, hides itself after that day)
             "2026-10-20 16:00"  (add a time to end at a set hour, e.g. 4pm)
     urgent: true          (orange edge + "Urgent" tag)
     link:   { text: "Read more", url: "https://..." }
   ============================================================ */
const ANNOUNCEMENTS = [
  { title: "Doctors meeting: Tuesday 20 October, 6pm at Crace", text: "Dinner's provided. Can't make dinner? Join online from 6:30pm.", roles: ["doctors"], until: "2026-10-20 18:00", link: { text: "RSVP now", url: "https://forms.cloud.microsoft/r/Rp75HS6R7u" } },
  { title: "Reception training night: Thursday 5 November, 6pm at Crace", text: "", roles: ["reception"], until: "2026-11-05 18:00", link: { text: "RSVP now", url: "https://forms.cloud.microsoft/r/Sj0Ahz4dME" } }
];

/* ===== Icons (line style, 24x24, per design system) ===== */
const P = {

const nav = document.getElementById('roleNav');
nav.innerHTML = ROLES.map(r =>
  `<button class="nav-item" data-role="${r.id}">${svg(r.icon,'nav-ic')}${esc(r.label)}</button>`
).join('');
document.getElementById('appsLink').href = YGP_APPS_URL;

const extIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
/* Logos are built into the page (LOGOS, bottom of the script), so nothing loads from outside sites.
   No logo -> line icon. ygp: true -> teal Y tile for YourGP-built tools. */
const BLEED = ['dermnet', 'nbmedical'];   // logos that are already a full square
function logoFor(l){
  if(l.ygp) return `<span class="l-logo ygp" aria-hidden="true">${svg(l.icon,'',2)}</span>`;
  const src = l.logo && LOGOS[l.logo];
  if(!src) return `<span class="l-logo" aria-hidden="true">${svg(l.icon,'',1.9)}</span>`;
  return `<span class="l-logo img${BLEED.includes(l.logo) ? ' bleed' : ''}" aria-hidden="true"><img src="${src}" alt=""></span>`;
}

function card(l){
  const body = `${logoFor(l)}<span class="l-name">${esc(l.name)}</span>`;
  const q = esc(l.name.toLowerCase());
  if(!l.site){
    return `<li class="lrow" data-q="${q}"><a class="l-main" href="${esc(l.url)}" target="_blank" rel="noopener">${body}<span class="sr-only">(opens in a new tab)</span></a>${arrow}</li>`;
  }
  return `<li class="lrow" data-q="${q}">
      <a class="l-main" href="${esc(l.url)}" target="_blank" rel="noopener">${body}<span class="sr-only">${l.login ? '(log in, opens in a new tab)' : '(opens in a new tab)'}</span></a>
      <span class="l-acts">
        <a class="l-btn primary" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${l.login ? 'Log in to' : 'Open'} ${esc(l.name)} (opens in a new tab)">${l.login ? 'Log in' : 'Open'}</a>
        <a class="l-btn" href="${esc(l.site)}" target="_blank" rel="noopener" aria-label="${esc(l.name)} public website (opens in a new tab)">Site${extIc}</a>
      </span>
    </li>`;
}
/* Announcement countdown.
   A date on its own ends at midnight at the end of that day. A date with a time ends at that time. */
function endOf(until){
  const [d, t] = String(until).trim().split(/[ T]/);
  const [y, m, day] = d.split('-').map(Number);
  if(t){ const [hh, mm] = t.split(':').map(Number); return new Date(y, m - 1, day, hh, mm || 0).getTime(); }
  return new Date(y, m - 1, day + 1, 0, 0).getTime();
}
const clockIc = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
function countdownText(end, timed){
  const ms = end - Date.now();
  const endDate = new Date(end - (timed ? 0 : 1));
  const dateStr = endDate.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
  const timeStr = endDate.toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }).replace(':00', '').replace(' ', '');
  const mins = Math.ceil(ms / 60000), hours = Math.floor(mins / 60);
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  const days = Math.round((new Date(endDate).setHours(0,0,0,0) - startToday) / 86400000);
  if(timed && mins <= 60*12) return { t: mins < 60 ? `${mins} min left` : `${hours}h ${mins % 60}m left`, soon: true, full: `Ends ${timeStr} today` };
  if(days <= 0) return { t: timed ? `Ends ${timeStr} today` : 'Last day today', soon: true, full: `Ends ${dateStr}` };
  if(days === 1) return { t: timed ? `Ends ${timeStr} tomorrow` : '1 day left', soon: true, full: `Ends ${dateStr}${timed ? ' ' + timeStr : ''}` };
  return { t: `${days} days left`, soon: false, full: `Ends ${dateStr}${timed ? ' ' + timeStr : ''}` };
}
function tickCountdowns(){
  document.querySelectorAll('.cd').forEach(el => {
    const end = +el.dataset.end;
    if(end <= Date.now()){            // ended while the page was open: take it down
      const li = el.closest('.callout'), list = li && li.parentNode; li && li.remove();
      const board = document.querySelector('.notices');
      if(board){ const n = board.querySelectorAll('.callout').length; if(!n) board.remove(); else board.querySelector('.n-count').textContent = n; }
      return;
    }
    const c = countdownText(end, el.dataset.timed === '1');
    el.innerHTML = `${clockIc}<span>${c.t}</span>${c.soon ? '' : `<span class="cd-date">· ${c.full.replace('Ends ', 'ends ')}</span>`}`;
    el.classList.toggle('soon', c.soon);
    el.setAttribute('title', c.full);
  });
}
setInterval(tickCountdowns, 30000);

function show(id){
  const role = ROLES.find(r => r.id === id) || ROLES.find(r => r.id === DEFAULT_ROLE);
  nav.querySelectorAll('.nav-item').forEach(b => {
    const on = b.dataset.role === role.id;
    b.classList.toggle('on', on);
    on ? b.setAttribute('aria-current','true') : b.removeAttribute('aria-current');
  });
  document.getElementById('roleTitle').textContent = role.label;
  const now = Date.now();
  const live = ANNOUNCEMENTS.filter(a =>
    (!a.roles || a.roles.includes(role.id)) && (!a.until || endOf(a.until) > now));
  const megaphone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>';
  const noticesHTML = !live.length ? '' : `
    <section class="notices" aria-labelledby="noticesH">
      <div class="n-head">
        <span class="n-badge">${megaphone}</span>
        <h2 id="noticesH">Announcements</h2>
        <span class="n-count">${live.length}</span>
      </div>
      <ul class="n-list">
      ${live.sort((a,b) => (b.urgent?1:0) - (a.urgent?1:0)).map(a => `
        <li class="callout${a.urgent ? ' urgent' : ''}">
          <div class="c-body">${a.urgent ? '<span class="tag">Urgent</span>' : ''}<span class="ch">${esc(a.title)}</span>${a.text ? `<span class="c-text">${esc(a.text)}</span>` : ''}</div>
          ${a.until ? `<span class="cd" data-end="${endOf(a.until)}" data-timed="${/\d:\d/.test(a.until) ? 1 : 0}"></span>` : ''}
          ${a.link ? `<a class="c-link" href="${esc(a.link.url)}" target="_blank" rel="noopener">${esc(a.link.text)}<span class="sr-only"> for ${esc(a.title)} (opens in a new tab)</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>` : ''}
        </li>`).join('')}
      </ul>
    </section>`;
  const searchHTML = !role.search ? '' : `
    <search class="finder" role="search">
      <label class="sr-only" for="q">Search ${esc(role.label.toLowerCase())} bookmarks</label>
      <svg class="f-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find a bookmark" aria-describedby="qHint qStatus">
      <kbd class="f-kbd" id="qHint" aria-label="Press slash to search">/</kbd>
      <div class="f-web" id="qWeb" hidden></div>
      <p class="sr-only" id="qStatus" role="status" aria-live="polite"></p>
    </search>`;
  const links = [...role.links].sort((x, y) => x.name.localeCompare(y.name, 'en', { sensitivity:'base' }));
  document.getElementById('content').innerHTML = searchHTML + noticesHTML + `
    <section class="bookmarks" aria-labelledby="bmH">
      <h2 class="sr-only" id="bmH">${esc(role.label)} bookmarks</h2>
      <ul class="lrows">${links.map(card).join('')}</ul>
      <p class="no-match" id="noMatch" hidden>No bookmarks match.</p>
    </section>`;
  tickCountdowns();
  if(role.search) wireSearch(role);
}

/* Search: filters the links as you type, and offers a topic search on each resource's site */
function wireSearch(role){
  const q = document.getElementById('q'), web = document.getElementById('qWeb'), status = document.getElementById('qStatus');
  const sites = [...role.links].filter(l => l.searchSite).sort((x, y) => x.name.localeCompare(y.name));
  const content = document.getElementById('content');
  function run(){
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    content.querySelectorAll('.lrow').forEach(r => { const hit = !term || r.dataset.q.includes(term); r.hidden = !hit; if(hit) shown++; });
    document.getElementById('noMatch').hidden = shown > 0;
    const notices = content.querySelector('.notices'); if(notices) notices.hidden = !!term;
    if(!term){ web.hidden = true; web.innerHTML = ''; status.textContent = ''; return; }
    const raw = q.value.trim();
    web.innerHTML = `<span class="f-web-l">${shown ? '' : 'No links match. '}Search “${esc(raw)}” on</span>` + sites.map(l =>
      `<a class="l-btn" href="https://www.google.com/search?q=${encodeURIComponent(raw + ' site:' + l.searchSite)}" target="_blank" rel="noopener" aria-label="Search ${esc(raw)} on ${esc(l.name)} (opens in a new tab)">${esc(l.name.replace('Australian Medicines Handbook','AMH').replace('Therapeutic Guidelines','eTG'))}</a>`).join('');
    web.hidden = false;
    status.textContent = shown ? `${shown} link${shown === 1 ? '' : 's'} match` : 'No links match. Topic search options below.';
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ const first = content.querySelector('.lrow:not([hidden]) .l-main'); if(first && q.value.trim()){ e.preventDefault(); first.click(); } }
    if(e.key === 'Escape' && q.value){ e.stopPropagation(); q.value = ''; run(); }
  });
}
document.addEventListener('keydown', e => {
  const q = document.getElementById('q');
  if(e.key === '/' && q && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
});

nav.addEventListener('click', e => {
  const b = e.target.closest('.nav-item'); if(!b) return;
  show(b.dataset.role);
  try{ history.replaceState(null, '', '#' + b.dataset.role); }catch(_){}
  if(mq.matches){ closeMenu(false); document.getElementById('content').focus(); }
});

/* Mobile drawer */
const sb = document.getElementById('sidebar'), bd = document.getElementById('backdrop'), mb = document.getElementById('menuBtn');
const mq = window.matchMedia('(max-width: 880px)');
const mainEl = document.getElementById('main');
function setDrawerState(open){
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
  mb.setAttribute('aria-expanded', String(open));
  mb.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  if(mq.matches){
    sb.inert = !open;            // hidden drawer can't be tabbed into
    mainEl.inert = open;         // page behind the open drawer can't be tabbed into
  } else { sb.inert = false; mainEl.inert = false; }
}
function openMenu(){ setDrawerState(true); const f = sb.querySelector('.nav-item.on') || sb.querySelector('.nav-item'); f && f.focus(); }
function closeMenu(returnFocus){ const wasOpen = sb.classList.contains('open'); setDrawerState(false); if(wasOpen && returnFocus && mq.matches) mb.focus(); }
mb.addEventListener('click', openMenu);
bd.addEventListener('click', () => closeMenu(true));
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(true); });
(mq.addEventListener ? mq.addEventListener('change', () => setDrawerState(false)) : mq.addListener(() => setDrawerState(false)));
setDrawerState(false);

/* Date */
document.getElementById('today').textContent = new Date().toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long' });

/* Start on Doctors unless the link says otherwise (#reception) */
show((location.hash || '').slice(1) || DEFAULT_ROLE);
</script>
