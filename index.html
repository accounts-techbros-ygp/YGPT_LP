<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#008C99">
<title>YourGP Start Page</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: YourGP app shell. Fixed left sidebar (role menu) + topbar + grouped link-card grid. Light mode only, per the YourGP design system. */
:root{
  color-scheme: light;
  --bg: oklch(98.5% 0.006 200);
  --surface: oklch(100% 0 0);
  --surface-sunk: oklch(97% 0.006 200);
  --ink: oklch(26% 0.02 220);
  --ink-muted: oklch(41% 0.016 220);
  --ink-faint: oklch(49% 0.014 220);
  --hairline: oklch(91% 0.008 200);
  --hairline-strong: oklch(83% 0.012 200);
  --accent: oklch(58% 0.11 205);
  --accent-strong: oklch(50% 0.12 205);
  --accent-weak: oklch(58% 0.11 205 / 0.12);
  --on-accent: oklch(100% 0 0);
  --danger: oklch(62% 0.19 45); --danger-soft: oklch(97% 0.035 55); --danger-ink: oklch(50% 0.18 45);
  --scrim: oklch(22% 0.02 220 / .45);
  --topbar-bg: oklch(98.5% 0.006 200 / 0.85);
  --radius: 14px; --radius-sm: 9px;
  --shadow: 0 1px 2px oklch(40% 0.03 220 / 0.05), 0 4px 16px oklch(40% 0.03 220 / 0.05);
  --shadow-hover: 0 2px 4px oklch(40% 0.03 220 / 0.06), 0 10px 24px oklch(40% 0.03 220 / 0.09);
  --shadow-pop: 0 8px 28px oklch(40% 0.03 220 / 0.14), 0 2px 6px oklch(40% 0.03 220 / 0.08);
  --sidebar-w: 256px;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button{ font:inherit; cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.app{ display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }

/* Sidebar */
.sidebar{ background:var(--surface); border-right:1px solid var(--hairline); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px; }
.brand .mark{ width:32px; height:32px; border-radius:9px; background:var(--accent); display:grid; place-items:center; color:var(--on-accent); font-weight:700; font-size:15px; font-family:var(--font-display); flex:none; }
.brand .nm{ font-weight:700; font-size:16px; letter-spacing:-.01em; line-height:1.25; }
.brand .nm span{ color:var(--ink-faint); font-weight:500; display:block; font-size:13px; letter-spacing:.02em; text-transform:uppercase; }
.nav-label{ font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); padding:12px 22px 4px; }
.nav{ padding:8px 12px; display:flex; flex-direction:column; gap:6px; }
.nav-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none; color:var(--ink-muted); padding:10px 12px; border-radius:var(--radius-sm); font-size:15px; font-weight:600; text-decoration:none; transition:background .12s, color .12s; }
.nav-item:hover{ background:var(--surface-sunk); color:var(--ink); }
.nav-item.on{ background:var(--accent-weak); color:var(--accent-strong); }
.nav-ic{ width:18px; height:18px; flex:0 0 auto; opacity:.85; }
.nav-item.on .nav-ic{ opacity:1; }
.nav-item .ext{ width:14px; height:14px; margin-left:auto; opacity:.6; }
.nav-div{ height:1px; background:var(--hairline); margin:10px 12px; }
.side-foot{ margin-top:auto; border-top:1px solid var(--hairline); padding:14px 22px 18px; font-size:13px; color:var(--ink-faint); }

/* Main */
.main{ display:flex; flex-direction:column; min-width:0; }
.topbar{ position:sticky; top:0; z-index:30; background:var(--topbar-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:14px; padding:10px 28px; }
.tb-titles{ min-width:0; }
.topbar .tt{ font-family:var(--font-display); font-weight:500; font-size:19px; letter-spacing:-.01em; }
.topbar .ts{ font-size:13.5px; color:var(--ink-muted); margin-top:1px; }
.today{ margin-left:auto; font-size:13.5px; color:var(--ink-faint); white-space:nowrap; }
.menu-btn{ display:none; align-items:center; justify-content:center; width:38px; height:38px; flex:none; border:1px solid var(--hairline-strong); background:var(--surface); border-radius:10px; color:var(--ink); padding:0; }
.menu-btn svg{ width:20px; height:20px; }
.nav-backdrop{ display:none; }

.content{ padding:18px 28px 40px; max-width:1480px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

/* Link groups: each group is a compact panel with a list of rows; panels flow into columns */
.groups{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap:14px; align-items:start; }
.lgroup{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px; min-width:0; }
.lgroup-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:8px 10px 6px; }
.lgroup-h h2{ font-family:var(--font-display); font-weight:500; font-size:15.5px; letter-spacing:-.01em; margin:0; }
.lgroup-h .cnt{ font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.lrows{ display:flex; flex-direction:column; }
.lrow{ display:flex; align-items:center; gap:8px; border-radius:var(--radius-sm); min-width:0; transition:background .12s; }
.lrow + .lrow{ border-top:1px solid var(--surface-sunk); }
.lrow:hover{ background:var(--surface-sunk); }
.l-main{ display:flex; align-items:center; gap:11px; flex:1; min-width:0; padding:7px 4px 7px 8px; text-decoration:none; color:var(--ink); border-radius:var(--radius-sm); }
.l-logo{ width:30px; height:30px; flex:none; border-radius:8px; border:1px solid var(--hairline); background:var(--surface); display:grid; place-items:center; overflow:hidden; color:var(--ink-muted); }
.l-logo img{ width:20px; height:20px; object-fit:contain; display:block; }
.l-logo svg{ width:17px; height:17px; }
.l-logo.ygp{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
.l-body{ min-width:0; flex:1; display:flex; flex-direction:column; }
.l-name{ font-weight:700; font-size:14.5px; letter-spacing:-.005em; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.l-desc{ font-size:12.5px; color:var(--ink-faint); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.l-main:hover .l-name{ color:var(--accent-strong); }
.l-acts{ display:flex; gap:5px; padding-right:6px; flex:none; }
.l-btn{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; padding:4px 8px; border-radius:7px; border:1px solid var(--hairline-strong); background:var(--surface); color:var(--ink-muted); text-decoration:none; white-space:nowrap; transition:border-color .12s, color .12s, background .12s; }
.l-btn svg{ width:11px; height:11px; }
.l-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
.l-btn.primary{ background:var(--accent-weak); border-color:transparent; color:var(--accent-strong); }
.l-btn.primary:hover{ background:var(--accent); color:var(--on-accent); }
.l-go{ width:14px; height:14px; flex:none; color:var(--ink-faint); opacity:0; transition:opacity .12s; margin-right:8px; }
.lrow:hover .l-go{ opacity:1; color:var(--accent-strong); }

/* Announcements: slim one-line strips (design system .callout pattern) */
.notices{ display:flex; flex-direction:column; gap:6px; }
.callout{ background:var(--surface); border:1px solid var(--hairline); border-left:3px solid var(--accent); border-radius:var(--radius-sm); padding:8px 14px; font-size:13.5px; color:var(--ink-muted); display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; }
.callout.urgent{ border-left-color:var(--danger); background:var(--danger-soft); }
.callout .c-ic{ width:16px; height:16px; flex:none; color:var(--accent-strong); }
.callout.urgent .c-ic{ color:var(--danger-ink); }
.callout .c-body{ flex:1 1 220px; min-width:0; }
.callout .ch{ font-weight:700; color:var(--ink); margin-right:6px; }
.callout .tag{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--danger-ink); margin-right:6px; }
.callout .meta{ font-size:12.5px; color:var(--ink-faint); white-space:nowrap; }
.callout .c-link{ font-size:13.5px; font-weight:600; color:var(--accent-strong); text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
.callout .c-link:hover{ text-decoration:underline; }
.callout .c-link svg{ width:12px; height:12px; }


/* Search (doctors) */
.finder{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 10px 6px 14px; }
.finder:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak), var(--shadow); }
.f-ic{ width:18px; height:18px; color:var(--ink-faint); flex:none; }
.finder input{ flex:1 1 200px; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:15px; color:var(--ink); padding:8px 0; }
.finder input::placeholder{ color:var(--ink-faint); }
.f-kbd{ font:600 12px var(--font-body); color:var(--ink-faint); border:1px solid var(--hairline-strong); border-bottom-width:2px; border-radius:6px; padding:1px 7px; }
.f-web{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px; border-top:1px solid var(--hairline); padding:8px 0 4px; }
.f-web-l{ font-size:13px; color:var(--ink-muted); margin-right:4px; }
@media (pointer:coarse){ .f-kbd{ display:none; } }

/* Accessibility helpers */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:12px; top:-60px; z-index:100; background:var(--ink); color:var(--surface); padding:10px 14px; border-radius:var(--radius-sm); font-weight:600; text-decoration:none; }
.skip:focus{ top:12px; }
.content:focus{ outline:none; }
.req{ color:var(--danger-ink); font-weight:700; margin-left:2px; }
.nav-note{ margin:2px 0 0; padding:0 12px 0 41px; font-size:12.5px; color:var(--ink-faint); }
.topbar .tt{ margin:0; }
.topbar .ts{ margin:1px 0 0; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

@media(max-width:880px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ position:fixed; left:0; top:0; height:100vh; width:280px; max-width:82vw; transform:translateX(-100%); transition:transform .25s ease; z-index:70; box-shadow:var(--shadow-pop); padding-top:env(safe-area-inset-top, 0px); }
  .sidebar.open{ transform:translateX(0); }
  .nav-backdrop{ display:block; position:fixed; inset:0; background:transparent; z-index:65; pointer-events:none; transition:background .25s ease; }
  .nav-backdrop.show{ background:var(--scrim); pointer-events:auto; }
  .menu-btn{ display:inline-flex; }
  .topbar{ padding:11px 16px; gap:11px; top:env(safe-area-inset-top, 0px); }
  .topbar .tt{ font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .ts{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .content{ padding:14px 16px 40px; gap:14px; }
}
@media (pointer:coarse), (max-width:880px){
  .l-main{ min-height:52px; }
  .l-btn{ min-height:40px; padding:6px 12px; font-size:13.5px; }
  .nav-item{ min-height:46px; }
  .callout .c-link{ min-height:40px; }
}
@media(max-width:520px){
  .topbar .ts, .today{ display:none; }
  .groups{ grid-template-columns:1fr; }
}
</style>

</head>

<a class="skip" href="#content">Skip to links</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="brand"><div class="mark" aria-hidden="true">Y</div><div class="nm">Start page<span>YourGP</span></div></div>
    <nav aria-labelledby="roleLabel">
      <div class="nav-label" id="roleLabel">I'm in</div>
      <div class="nav" id="roleNav"></div>
    </nav>
    <div class="nav-div" role="presentation"></div>

      <a class="nav-item" id="appsLink" href="#" target="_blank" rel="noopener">
        <svg class="nav-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        <span>YGP Apps<span class="req" aria-hidden="true">*</span></span>
        <span class="sr-only">(needs login, opens in a new tab)</span>
        <svg class="ext" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>

    <div class="side-foot">YourGP · Crace, Denman, Lyneham</div>
  </aside>
  <div class="nav-backdrop" id="backdrop" aria-hidden="true"></div>

  <div class="main" id="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="tb-titles"><h1 class="tt" id="roleTitle">Doctors</h1><p class="ts" id="roleSub"></p></div>
      <div class="today" id="today"></div>
    </header>
    <main class="content" id="content" tabindex="-1" aria-labelledby="roleTitle"></main>
  </div>
</div>

<script>
/* ============================================================
   LINKS: edit this block to change what's on the page.
   Each role has groups; each group has links {name, desc, url, icon}.
   Icons available: see ICONS below.
   ============================================================ */
const YGP_APPS_URL = "https://ygpapp.com/";

/* Link fields:
     name, desc, icon
     url   = where the card goes (for doctors this is the login page)
     site  = optional public website, shown as a second "Website" button
     login = true  -> main button says "Log in" instead of "Open"          */
const ROLES = [
  {
    id: "doctors", label: "Doctors", icon: "steth", search: true,
    sub: "Clinical references and patient resources. Log in or open the public site.",
    groups: [
      { title: "Guidelines and references", links: [
        { name: "Therapeutic Guidelines", searchSite: "tg.org.au", desc: "eTG. Prescribing and management guidance.", url: "https://portal.tg.org.au", site: "https://www.tg.org.au/", login: true, icon: "book" },
        { name: "Australian Medicines Handbook", searchSite: "amh.net.au", desc: "Drug info, doses and interactions.", url: "https://amhonline.amh.net.au/auth", site: "https://shop.amh.net.au/", login: true, icon: "pill" },
        { name: "GPnotebook", searchSite: "gpnotebook.com", desc: "Quick clinical reference for GPs.", url: "https://gpnotebook.com/en-AU/sign-in?from=%2Fen-AU", site: "https://gpnotebook.com/en-AU", login: true, icon: "note" },
        { name: "Austroads", searchSite: "austroads.gov.au", desc: "Assessing fitness to drive standards.", url: "https://austroads.gov.au/login", site: "https://austroads.gov.au/", login: true, icon: "car" }
      ]},
      { title: "Patient info and learning", links: [
        { name: "Patient Info", searchSite: "patient.info", desc: "Patient leaflets and professional reference articles.", url: "https://accounts.patient.info/sign-in?redirect_url=https%3A%2F%2Fpatient.info%2F", site: "https://patient.info/", login: true, icon: "info" },
        { name: "DermNet", searchSite: "dermnetnz.org", desc: "Skin condition images and information.", url: "https://pro.dermnetnz.org/Security/login?BackURL=home", site: "https://dermnetnz.org/", login: true, icon: "image" },
        { name: "NB Medical", desc: "Hot Topics updates and GP education.", url: "https://www.nbmedical.com/", icon: "cap" }
      ]},
      { title: "Team", links: [
        { name: "MS Teams", desc: "Chat with the team and the other sites.", url: "https://teams.microsoft.com/v2/", icon: "chat" },
        { name: "Outlook", desc: "Email and calendar.", url: "https://outlook.office.com/", icon: "mail" }
      ]}
    ]
  },
  {
    id: "reception", label: "Reception/Admin", icon: "desk",
    sub: "Bookings, patient comms and the tools that keep the front desk moving.",
    groups: [
      { title: "Daily tools", links: [
        { name: "MS Teams", desc: "Chat with doctors and the other sites.", url: "https://teams.microsoft.com/v2/", icon: "chat" },
        { name: "Cloop", ygp: true, desc: "Calls and emails in one inbox.", url: "https://launcher.myapps.microsoft.com/api/signin/053b1ab2-950c-4dcb-ba80-f04d21f9ba72?tenantId=d9d0a520-4423-4c6b-aa80-01127574c968", icon: "headset" },
        { name: "Tasky", ygp: true, desc: "Tasks for reception and site managers.", url: "https://tasky.ygpapp.com/", icon: "check" },
        { name: "HotDoc", desc: "Online bookings, reminders and recalls.", url: "https://www.hotdoc.com.au/dashboard#/login", icon: "calendar" },
        { name: "Automed", desc: "Patient check-in and online forms.", url: "https://automedsystems.com.au/online/dashboard/login", icon: "kiosk" },
        { name: "CRT", ygp: true, desc: "Call review tool.", url: "https://staging.crt.ygpapp.com/login", icon: "mic" }
      ]},
      { title: "Playbook and reference", links: [
        { name: "Playbook", desc: "How we do things at YourGP.", url: "https://yourgpcanberra.sharepoint.com/sites/TheNewPlaybook", icon: "folder" },
        { name: "GP preferences", desc: "Each GP's booking and appointment preferences.", url: "https://yourgpcanberra.sharepoint.com/:l:/r/sites/TheNewPlaybook/Lists/GP%20Preferences?e=icRveQ", icon: "list" },
        { name: "National Immunisation Program", desc: "The current NIP schedule.", url: "https://www.health.gov.au/resources/publications/national-immunisation-program-schedule?language=en", icon: "shield" }
      ]}
    ]
  },
  {
    id: "coaches", label: "Coaches", icon: "heart",
    sub: "Sample links for now. Real ones coming soon.",
    groups: [
      { title: "Team and YourGP", links: [
        { name: "MS Teams", desc: "Chat with GPs and the care team.", url: "https://teams.microsoft.com/v2/", icon: "chat" },
        { name: "Tasky", ygp: true, desc: "Follow-ups and handovers.", url: "https://tasky.ygpapp.com/", icon: "check" },
        { name: "Playbook", desc: "How we do things at YourGP.", url: "https://yourgpcanberra.sharepoint.com/sites/TheNewPlaybook", icon: "folder" }
      ]},
      { title: "Patient resources (sample)", links: [
        { name: "healthdirect", desc: "Plain-language health info to share with patients.", url: "https://www.healthdirect.gov.au", icon: "info" },
        { name: "Head to Health", desc: "Mental health services and support finder.", url: "https://www.headtohealth.gov.au", icon: "heart" }
      ]}
    ]
  }
];
const DEFAULT_ROLE = "doctors";

/* ============================================================
   ANNOUNCEMENTS: shown at the top of the page.
   Leave the list empty  ->  []  and the whole section disappears.
   Optional fields:
     roles:  ["doctors","reception","coaches"]  (leave out = everyone)
     until:  "2026-10-20"  (hides itself after this date)
     urgent: true          (orange edge + "Urgent" tag)
     link:   { text: "Read more", url: "https://..." }
   ============================================================ */
const ANNOUNCEMENTS = [
  { title: "Flu vaccine stock is in", text: "Book patients in from Monday. Stock is at all three sites. Check the fridge log before the first clinic.", until: "2026-10-31" },
  { title: "Phones down at Lyneham this afternoon", text: "Telstra is working on the line from 2pm to 4pm. Calls will divert to Crace.", urgent: true, roles: ["reception"], until: "2026-10-07" },
  { title: "Clinical meeting Thursday 12:30", text: "Lunch is provided. We're covering the new chronic disease plan items.", roles: ["doctors"], link: { text: "Agenda", url: "#" } }
];

/* ===== Icons (line style, 24x24, per design system) ===== */
const P = {
  steth:'<path d="M6 3v5a5 5 0 0 0 10 0V3"/><path d="M11 13v2a5 5 0 0 0 10 0v-1"/><circle cx="21" cy="12" r="1.6"/>',
  desk:'<path d="M3 10h18"/><path d="M5 10v10M19 10v10"/><rect x="8" y="3.5" width="8" height="6.5" rx="1.2"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  route:'<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/>',
  book:'<path d="M4 5.5A2 2 0 0 1 6 3.5h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20.5v-15M8 8h7"/>',
  pill:'<rect x="2.8" y="8.3" width="18.4" height="7.4" rx="3.7" transform="rotate(-45 12 12)"/><path d="m8.6 8.6 6.8 6.8"/>',
  shield:'<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8 7.5 9.5 4.3-1.5 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',

  id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16a3.4 3.4 0 0 1 6.4 0M14.5 10h3.5M14.5 13.5h3.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
  chat:'<path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.4A7.5 7.5 0 1 1 20 12z"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  folder:'<path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

  key:'<circle cx="8" cy="15" r="4"/><path d="m10.9 12.1 8.6-8.6M16.5 6.5l2.5 2.5M14 9l2 2"/>',

  note:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3h8L19 7.5V19.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5z"/><path d="M14.5 3v4.5H19M8.5 12h7M8.5 15.5h5"/>',
  cap:'<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.4 2.5 3 5.5 3s5.5-1.6 5.5-3V11M21.5 9v5"/>',
  car:'<path d="M5 16.5V12l2-5h10l2 5v4.5"/><path d="M3.5 16.5h17v2h-17zM5 12h14"/><circle cx="8" cy="14.3" r=".6"/><circle cx="16" cy="14.3" r=".6"/>',
  image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 17.5 5-4.5 4 3.5 2.5-2 4.5 3.5"/>',
  kiosk:'<rect x="6" y="2.5" width="12" height="13" rx="1.6"/><path d="M9.5 6.5h5M9.5 10h5M12 15.5v4M8 21h8"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  list:'<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="5" cy="6.5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17.5" r="1"/>'
};
const svg = (k, cls, w) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]||P.info}</svg>`;
const arrow = '<svg class="l-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Render ===== */
const nav = document.getElementById('roleNav');
nav.innerHTML = ROLES.map(r =>
  `<button class="nav-item" data-role="${r.id}">${svg(r.icon,'nav-ic')}${esc(r.label)}</button>`
).join('');
document.getElementById('appsLink').href = YGP_APPS_URL;

const extIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
/* Logos: pulled from each site's favicon when the page is hosted.
   If a logo can't load (or in the Claude preview, which blocks outside images),
   the line icon shows instead. Set  logo: "domain.com"  to override, logo: false for icon only,
   ygp: true for YourGP-built tools (shows the teal Y mark).                                   */
const LOGO_SRC = d => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64`;
function logoFor(l){
  if(l.ygp) return `<span class="l-logo ygp" aria-hidden="true">${svg(l.icon,'',2)}</span>`;
  let d = l.logo;
  if(d === false) return `<span class="l-logo" aria-hidden="true">${svg(l.icon,'',1.9)}</span>`;
  if(!d){ try{ d = new URL(l.site || l.url).hostname; }catch(_){ d = ''; } }
  if(!d) return `<span class="l-logo" aria-hidden="true">${svg(l.icon,'',1.9)}</span>`;
  return `<span class="l-logo" aria-hidden="true" data-icon="${esc(l.icon)}"><img src="${esc(LOGO_SRC(d))}" alt="" loading="lazy" onerror="logoFail(this)"></span>`;
}
function logoFail(img){ const box = img.parentNode; if(box) box.innerHTML = svg(box.dataset.icon,'',1.9); }
window.logoFail = logoFail;

function card(l){
  const body = `${logoFor(l)}<span class="l-body"><span class="l-name">${esc(l.name)}</span><span class="l-desc">${esc(l.desc)}</span></span>`;
  if(!l.site){
    return `<div class="lrow" data-q="${esc((l.name+' '+l.desc).toLowerCase())}"><a class="l-main" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.desc)}">${body}<span class="sr-only">(opens in a new tab)</span></a>${arrow}</div>`;
  }
  return `<div class="lrow" data-q="${esc((l.name+' '+l.desc).toLowerCase())}">
      <a class="l-main" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.desc)}">${body}<span class="sr-only">${l.login ? '(log in, opens in a new tab)' : '(opens in a new tab)'}</span></a>
      <div class="l-acts">
        <a class="l-btn primary" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${l.login ? 'Log in to' : 'Open'} ${esc(l.name)} (opens in a new tab)">${l.login ? 'Log in' : 'Open'}</a>
        <a class="l-btn" href="${esc(l.site)}" target="_blank" rel="noopener" aria-label="${esc(l.name)} public website (opens in a new tab)">Site${extIc}</a>
      </div>
    </div>`;
}
function show(id){
  const role = ROLES.find(r => r.id === id) || ROLES.find(r => r.id === DEFAULT_ROLE);
  nav.querySelectorAll('.nav-item').forEach(b => {
    const on = b.dataset.role === role.id;
    b.classList.toggle('on', on);
    on ? b.setAttribute('aria-current','true') : b.removeAttribute('aria-current');
  });
  document.getElementById('roleTitle').textContent = role.label;
  document.getElementById('roleSub').textContent = role.sub;
  const todayISO = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
  const live = ANNOUNCEMENTS.filter(a =>
    (!a.roles || a.roles.includes(role.id)) && (!a.until || a.until >= todayISO));
  const fmt = d => new Date(d + 'T00:00').toLocaleDateString('en-AU', { day:'numeric', month:'short' });
  const megaphone = '<svg class="c-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>';
  const noticesHTML = !live.length ? '' : `
    <section class="notices" aria-labelledby="noticesH"><h2 class="sr-only" id="noticesH">Announcements</h2>
      ${live.sort((a,b) => (b.urgent?1:0) - (a.urgent?1:0)).map(a => `
        <div class="callout${a.urgent ? ' urgent' : ''}">
          ${megaphone}
          <div class="c-body">${a.urgent ? '<span class="tag">Urgent</span>' : ''}<span class="ch">${esc(a.title)}</span>${esc(a.text)}</div>
          ${a.until ? `<span class="meta">Until ${fmt(a.until)}</span>` : ''}
          ${a.link ? `<a class="c-link" href="${esc(a.link.url)}" target="_blank" rel="noopener">${esc(a.link.text)}<span class="sr-only"> for ${esc(a.title)} (opens in a new tab)</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>` : ''}
        </div>`).join('')}
    </section>`;
  const searchHTML = !role.search ? '' : `
    <search class="finder" role="search">
      <label class="sr-only" for="q">Search ${esc(role.label.toLowerCase())} links</label>
      <svg class="f-ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find a link, or search a topic like asthma" aria-describedby="qHint qStatus">
      <kbd class="f-kbd" id="qHint" aria-label="Press slash to search">/</kbd>
      <div class="f-web" id="qWeb" hidden></div>
      <p class="sr-only" id="qStatus" role="status" aria-live="polite"></p>
    </search>`;
  document.getElementById('content').innerHTML = searchHTML + noticesHTML + `<div class="groups">` + role.groups.map(g => `
    <section class="lgroup">
      <div class="lgroup-h"><h2>${esc(g.title)}</h2><span class="cnt">${g.links.length}</span></div>
      <div class="lrows">${g.links.map(card).join('')}</div>
    </section>`).join('') + `</div>`;
  if(role.search) wireSearch(role);
}

/* Search: filters the links as you type, and offers a topic search on each resource's site */
function wireSearch(role){
  const q = document.getElementById('q'), web = document.getElementById('qWeb'), status = document.getElementById('qStatus');
  const sites = role.groups.flatMap(g => g.links).filter(l => l.searchSite);
  const content = document.getElementById('content');
  function run(){
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    content.querySelectorAll('.lgroup').forEach(g => {
      let n = 0;
      g.querySelectorAll('.lrow').forEach(r => { const hit = !term || r.dataset.q.includes(term); r.hidden = !hit; if(hit) n++; });
      g.hidden = n === 0; shown += n;
    });
    const notices = content.querySelector('.notices'); if(notices) notices.hidden = !!term;
    if(!term){ web.hidden = true; web.innerHTML = ''; status.textContent = ''; return; }
    const raw = q.value.trim();
    web.innerHTML = `<span class="f-web-l">${shown ? '' : 'No links match. '}Search “${esc(raw)}” on</span>` + sites.map(l =>
      `<a class="l-btn" href="https://www.google.com/search?q=${encodeURIComponent(raw + ' site:' + l.searchSite)}" target="_blank" rel="noopener" aria-label="Search ${esc(raw)} on ${esc(l.name)} (opens in a new tab)">${esc(l.name.replace('Australian Medicines Handbook','AMH').replace('Therapeutic Guidelines','eTG'))}</a>`).join('');
    web.hidden = false;
    status.textContent = shown ? `${shown} link${shown === 1 ? '' : 's'} match` : 'No links match. Topic search options below.';
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ const first = content.querySelector('.lrow:not([hidden]) .l-main'); if(first && q.value.trim()){ e.preventDefault(); first.click(); } }
    if(e.key === 'Escape' && q.value){ e.stopPropagation(); q.value = ''; run(); }
  });
}
document.addEventListener('keydown', e => {
  const q = document.getElementById('q');
  if(e.key === '/' && q && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
});

nav.addEventListener('click', e => {
  const b = e.target.closest('.nav-item'); if(!b) return;
  show(b.dataset.role);
  try{ history.replaceState(null, '', '#' + b.dataset.role); }catch(_){}
  if(mq.matches){ closeMenu(false); document.getElementById('content').focus(); }
});

/* Mobile drawer */
const sb = document.getElementById('sidebar'), bd = document.getElementById('backdrop'), mb = document.getElementById('menuBtn');
const mq = window.matchMedia('(max-width: 880px)');
const mainEl = document.getElementById('main');
function setDrawerState(open){
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
  mb.setAttribute('aria-expanded', String(open));
  mb.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  if(mq.matches){
    sb.inert = !open;            // hidden drawer can't be tabbed into
    mainEl.inert = open;         // page behind the open drawer can't be tabbed into
  } else { sb.inert = false; mainEl.inert = false; }
}
function openMenu(){ setDrawerState(true); const f = sb.querySelector('.nav-item.on') || sb.querySelector('.nav-item'); f && f.focus(); }
function closeMenu(returnFocus){ const wasOpen = sb.classList.contains('open'); setDrawerState(false); if(wasOpen && returnFocus && mq.matches) mb.focus(); }
mb.addEventListener('click', openMenu);
bd.addEventListener('click', () => closeMenu(true));
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(true); });
(mq.addEventListener ? mq.addEventListener('change', () => setDrawerState(false)) : mq.addListener(() => setDrawerState(false)));
setDrawerState(false);

/* Date */
document.getElementById('today').textContent = new Date().toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long' });

/* Start on Doctors unless the link says otherwise (#reception, #coaches) */
show((location.hash || '').slice(1) || DEFAULT_ROLE);
</script>
